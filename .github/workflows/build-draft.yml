name: Build and Validate Internet-Draft

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the changed files back to the repository.
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get install -y --no-install-recommends mmark xml2rfc

      - name: Determine current draft file
        id: current
        run: |
          # Picks the highest-numbered draft-sweetser-bcp-rpki-ca-NN.md in the repo root.
          FILE=$(ls draft-sweetser-bcp-rpki-ca-??.md | sort | tail -n1)
          echo "stem=${FILE%.md}" >> "$GITHUB_OUTPUT"

      - name: Auto-bump version if draft content changed
        id: draft
        run: |
          # On a push to main, compares the draft body (excluding the date/value
          # frontmatter lines this step itself rewrites, so its own edits never
          # trigger a repeat bump) against the hash recorded at the last bump. If
          # it differs, renames the four build files to the next revision number
          # and updates the frontmatter -- so branch work only ever becomes a new
          # revision at the point it's merged to main, never while on a branch or PR.
          STEM="${{ steps.current.outputs.stem }}"
          FILE="${STEM}.md"
          BODY_HASH=$(grep -vE '^(date = |value = "draft-sweetser-bcp-rpki-ca-)' "${FILE}" | sha256sum | cut -d' ' -f1)
          STORED_HASH=""
          if [ -f .ietf-content-hash ]; then
            STORED_HASH=$(cat .ietf-content-hash)
          fi

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "${STORED_HASH}" ] && [ "${BODY_HASH}" != "${STORED_HASH}" ]; then
            CURRENT_NUM=$(echo "${STEM}" | grep -oE '[0-9]+$')
            NEXT_NUM=$(printf "%02d" $((10#${CURRENT_NUM} + 1)))
            NEXT_STEM="draft-sweetser-bcp-rpki-ca-${NEXT_NUM}"
            echo "Draft content changed: bumping ${STEM} -> ${NEXT_STEM}"
            for ext in md xml txt html; do
              if [ -f "${STEM}.${ext}" ]; then
                git mv "${STEM}.${ext}" "${NEXT_STEM}.${ext}"
              fi
            done
            TODAY=$(date -u +%Y-%m-%dT00:00:00Z)
            sed -i "s/^date = .*/date = ${TODAY}/" "${NEXT_STEM}.md"
            sed -i "s/value = \"draft-sweetser-bcp-rpki-ca-[0-9]*\"/value = \"${NEXT_STEM}\"/" "${NEXT_STEM}.md"
            echo "${BODY_HASH}" > .ietf-content-hash
            echo "stem=${NEXT_STEM}" >> "$GITHUB_OUTPUT"
          else
            echo "stem=${STEM}" >> "$GITHUB_OUTPUT"
            if [ -z "${STORED_HASH}" ]; then
              # First run with this feature enabled: record the baseline without bumping.
              echo "${BODY_HASH}" > .ietf-content-hash
            fi
          fi

      - name: Convert Markdown to XML (using mmark)
        run: |
          mmark ${{ steps.draft.outputs.stem }}.md > ${{ steps.draft.outputs.stem }}.xml

      - name: Generate IETF formats (using xml2rfc)
        run: |
          xml2rfc --text --html --v3 ${{ steps.draft.outputs.stem }}.xml

      - name: Validate XML (maybe add IDNITS later?)
        run: |
          xml2rfc --strict ${{ steps.draft.outputs.stem }}.xml

      - name: Safekeeping in artefacts (if we make it this far)
        uses: actions/upload-artifact@v4
        with:
          name: ietf-draft-outputs
          path: |
            ${{ steps.draft.outputs.stem }}.md
            ${{ steps.draft.outputs.stem }}.xml
            ${{ steps.draft.outputs.stem }}.txt
            ${{ steps.draft.outputs.stem }}.html

      - name: Check whether this version was already submitted
        id: submitcheck
        run: |
          # .ietf-submission-state tracks the last version number we POSTed to the
          # datatracker, so we only submit again when the frontmatter version
          # actually increments (not on every content-only push).
          CURRENT_VERSION=$(echo "${{ steps.draft.outputs.stem }}" | grep -oE '[0-9]+$')
          LAST_SUBMITTED=""
          if [ -f .ietf-submission-state ]; then
            LAST_SUBMITTED=$(cat .ietf-submission-state)
          fi
          echo "current=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${CURRENT_VERSION}" != "${LAST_SUBMITTED}" ]; then
            echo "should_submit=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_submit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit new version to the IETF datatracker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.submitcheck.outputs.should_submit == 'true'
        env:
          DATATRACKER_USER: tcsweetser@gmail.com
        run: |
          RESPONSE=$(curl -sS -F "user=${DATATRACKER_USER}" -F "xml=@${{ steps.draft.outputs.stem }}.xml" https://datatracker.ietf.org/api/submission)
          echo "${RESPONSE}"
          if echo "${RESPONSE}" | grep -q '"error"'; then
            echo "::error::Datatracker submission failed: ${RESPONSE}"
            exit 1
          fi
          echo "::notice::Submitted ${{ steps.draft.outputs.stem }} to the datatracker. A confirmation email is on its way to ${DATATRACKER_USER} — the draft is NOT public until that link is clicked; the datatracker requires this for every submission and it cannot be automated."

      - name: Record submitted version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.submitcheck.outputs.should_submit == 'true'
        run: echo "${{ steps.submitcheck.outputs.current }}" > .ietf-submission-state

      - name: Commit those files
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: Automated update of xml/txt/html versions

